<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Horno Vivo Pizzería: pizzas artesanales al horno, ingredientes frescos, reservas y pedidos en una experiencia web accesible.">
  <meta name="theme-color" content="#8b1e12">
  <title>Pizzería artesanal accesible</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div data-include="components/svg-library.html"></div>

  <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
  <a class="skip-link" href="#pedido">Saltar a realizar pedido</a>

  <div id="page-content">
    <div data-include="components/topbar.html"></div>
    <div data-include="components/header.html"></div>

    <main id="contenido" tabindex="-1">
      <div class="container breadcrumbs">
        <nav aria-label="Ruta de navegación">
          <ol>
            <li><a href="#inicio">Inicio</a></li>
            <li aria-current="page">Pizzería artesanal</li>
          </ol>
        </nav>
      </div>

      <div data-include="components/hero.html"></div>
      <div data-include="components/menu.html"></div>
      <div data-include="components/history.html"></div>
      <div data-include="components/hours.html"></div>
      <div data-include="components/order-form.html"></div>
      <div data-include="components/faq.html"></div>
      <div data-include="components/accessibility.html"></div>
    </main>

    <div data-include="components/footer.html"></div>
  </div>

  <div data-include="components/a11y-panel.html"></div>
  <div class="reading-guide" id="readingGuide" aria-hidden="true"></div>
  <div data-include="components/modals.html"></div>

  <script>
    async function loadComponents() {
      const includes = document.querySelectorAll('[data-include]');
      for (const el of includes) {
        try {
          const response = await fetch(el.getAttribute('data-include'));
          if (response.ok) {
            el.outerHTML = await response.text();
          } else {
            console.error('Error cargando componente:', el.getAttribute('data-include'));
          }
        } catch (error) {
          console.error('Error de red al cargar:', error);
        }
      }
            const script = document.createElement('script');
      script.type = 'module';
      script.src = 'js/app.js';
      document.body.appendChild(script);
    }
    
    loadComponents();
  </script>
</body>
</html>
